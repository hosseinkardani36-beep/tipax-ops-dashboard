<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>داشبورد عملیات تیپاکس</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f5f9;
      color: #202938;
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 1200px; margin: auto; }
    h1 { color: #12366b; font-size: 24px; }
    .panel, .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #0000000c;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .card strong { display: block; font-size: 25px; margin-top: 10px; }
    input, button {
      font: inherit;
      padding: 11px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    button { background: #174a8b; color: white; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px;
      text-align: right;
      white-space: nowrap;
    }
    th { background: #eaf0f8; }
    .status { padding: 10px; border-radius: 8px; background: #eef5ff; }
    .error { background: #fff0f0; color: #a00000; }
  </style>
</head>
<body>
<div class="container">
  <h1>داشبورد عملیات تیپاکس</h1>
  <p>گزارش رسوب بارهای خوزستان و لرستان</p>

  <section class="panel">
    <label for="fileInput">فایل اکسل گزارش رسوب را انتخاب کن:</label><br>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv">
    <button id="loadBtn">بارگذاری و تحلیل</button>
    <div id="status" class="status">هنوز فایلی بارگذاری نشده است.</div>
  </section>

  <section class="cards">
    <div class="card">کل ردیف‌ها<strong id="total">۰</strong></div>
    <div class="card">خوزستان<strong id="khuzestan">۰</strong></div>
    <div class="card">لرستان<strong id="lorestan">۰</strong></div>
    <div class="card">استان نامشخص<strong id="unknown">۰</strong></div>
    <div class="card">جمع روزهای رسوب<strong id="days">۰</strong></div>
  </section>

  <section class="panel">
    <label for="search">جست‌وجو در نتایج:</label><br>
    <input id="search" type="search" placeholder="بارکد، شهر، نمایندگی یا استان..." style="width:90%">
    <div class="table-wrap">
      <table>
        <thead><tr id="headers"></tr></thead>
        <tbody id="results"></tbody>
      </table>
    </div>
    <p id="tableInfo"></p>
  </section>
</div>

<script>
(() => {
  let allRows = [];
  let columns = [];

  const $ = id => document.getElementById(id);

  function normalize(value) {
    return String(value ?? "")
      .replace(/ي/g, "ی")
      .replace(/ك/g, "ک")
      .replace(/ۀ/g, "ه")
      .replace(/ة/g, "ه")
      .replace(/[\u200c\u200f\u202a-\u202e]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function key(value) {
    return normalize(value)
      .replace(/[\s_\-‌]+/g, "")
      .toLowerCase();
  }

  function findColumn(names) {
    const normalized = columns.map(c => ({ original: c, k: key(c) }));

    for (const name of names) {
      const exact = normalized.find(c => c.k === key(name));
      if (exact) return exact.original;
    }

    for (const name of names) {
      const partial = normalized.find(c => c.k.includes(key(name)));
      if (partial) return partial.original;
    }
    return null;
  }

  function getProvince(row) {
    const col = findColumn([
      "استان رسوب",
      "استان",
      "استان ایجاد کننده",
      "استان فرستنده",
      "استان گیرنده"
    ]);

    if (!col) return "نامشخص";

    const value = normalize(row[col]);
    const k = key(value);

    if (k.includes("خوزستان")) return "خوزستان";
    if (k.includes("لرستان")) return "لرستان";
    return value || "نامشخص";
  }

  function getDays(row) {
    const col = findColumn(["تعداد روزهای رسوب"]);
    if (!col) return 0;
    const value = String(row[col] ?? "").replace(/,/g, "").trim();
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }

  function setStatus(message, error = false) {
    $("status").textContent = message;
    $("status").className = error ? "status error" : "status";
  }

  function render() {
    const query = normalize($("search").value).toLowerCase();
    const filtered = allRows.filter(row =>
      !query || columns.some(col =>
        normalize(row[col]).toLowerCase().includes(query)
      )
    );

    const header = $("headers");
    header.replaceChildren();
    columns.forEach(col => {
      const th = document.createElement("th");
      th.textContent = col;
      header.appendChild(th);
    });

    const body = $("results");
    body.replaceChildren();

    filtered.slice(0, 1000).forEach(row => {
      const tr = document.createElement("tr");
      columns.forEach(col => {
        const td = document.createElement("td");
        td.textContent = row[col] == null ? "" : String(row[col]);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    $("tableInfo").textContent =
      `نتایج: ${filtered.length.toLocaleString("fa-IR")} ردیف؛ نمایش حداکثر ۱۰۰۰ ردیف اول.`;
  }

  function analyze(rows) {
    allRows = rows;
    columns = rows.length ? Object.keys(rows[0]) : [];

    const provinceColumn = findColumn(["استان رسوب"]);
    if (!provinceColumn) {
      setStatus(
        "ستون «استان رسوب» در فایل پیدا نشد. عنوان ستون‌های فایل را بررسی کن.",
        true
      );
      return;
    }

    let kh = 0, lo = 0, unknown = 0, days = 0;

    allRows.forEach(row => {
      const province = getProvince(row);
      if (province === "خوزستان") kh++;
      else if (province === "لرستان") lo++;
      else unknown++;
      days += getDays(row);
    });

    $("total").textContent = allRows.length.toLocaleString("fa-IR");
    $("khuzestan").textContent = kh.toLocaleString("fa-IR");
    $("lorestan").textContent = lo.toLocaleString("fa-IR");
    $("unknown").textContent = unknown.toLocaleString("fa-IR");
    $("days").textContent = days.toLocaleString("fa-IR");

    setStatus(
      `فایل با موفقیت خوانده شد. ستون استان: «${provinceColumn}». ` +
      `خوزستان: ${kh}، لرستان: ${lo}، نامشخص: ${unknown}`
    );

    render();
  }

  $("loadBtn").addEventListener("click", async () => {
    const file = $("fileInput").files[0];

    if (!file) {
      setStatus("ابتدا فایل اکسل را انتخاب کن.", true);
      return;
    }

    if (typeof XLSX === "undefined") {
      setStatus("کتابخانه خواندن اکسل بارگذاری نشده است. اینترنت را بررسی کن.", true);
      return;
    }

    try {
      setStatus("در حال خواندن فایل...");
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      if (!rows.length) {
        setStatus("در شیت اول داده‌ای پیدا نشد.", true);
        return;
      }

      analyze(rows);
    } catch (error) {
      setStatus("خواندن فایل ناموفق بود. فایل اکسل سالم و قابل باز شدن را انتخاب کن.", true);
      console.error(error);
    }
  });

  $("search").addEventListener("input", render);
})();
</script>
</body>
</html>
